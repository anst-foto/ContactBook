services:
  postgres:
    container_name: ${SOLUTION_NAME:-contactbook}_db_container
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-contactbook_db}
      POSTGRES_USER: ${POSTGRES_USER:-contactbook_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      # Снаружи — ${POSTGRES_PORT}, внутри — всегда 5432.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 1m
    deploy:
      resources:
        limits:
          cpus: '${POSTGRES_CPUS:-1}'
          memory: ${POSTGRES_MEMORY:-4G}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - contactbook_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  pgadmin:
    container_name: ${SOLUTION_NAME:-contactbook}_pgadmin_container
    image: dpage/pgadmin4:9.18
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change-me}
      PGADMIN_CONFIG_SERVER_MODE: ${PGADMIN_CONFIG_SERVER_MODE:-False}
      # Отключаем мастер первого запуска — настройка через env.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${PGADMIN_CPUS:-0.5}'
          memory: ${PGADMIN_MEMORY:-1G}
    volumes:
      # Сохраняем настройки, подключения и пароли между пересозданиями.
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - contactbook_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${SOLUTION_NAME:-contactbook}-api:local
    container_name: ${SOLUTION_NAME:-contactbook}_api_container
    env_file:
      - path: .env
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      # Внутри docker-сети Postgres всегда на 5432 — внешний ${POSTGRES_PORT} тут не при чём.
      ConnectionStrings__DefaultDocker: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-contactbook_db};
        Username=${POSTGRES_USER:-contactbook_app};Password=${POSTGRES_PASSWORD:-change-me}
      RunMigrations: ${RUN_MIGRATIONS:-true}
      NLog__variables__consoleLogLevel: ${NLOG_LOG_LEVEL:-Information}
      NLog__variables__fileLogLevel: ${NLOG_LOG_LEVEL:-Information}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '${API_CPUS:-1}'
          memory: ${API_MEMORY:-1G}
    volumes:
      # Файловые логи NLog — на хост, чтобы читать без docker exec.
      - ./logs/api:/app/logs
    networks:
      - contactbook_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  contactbook_network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data: